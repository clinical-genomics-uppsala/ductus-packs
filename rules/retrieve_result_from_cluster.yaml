---
name: "retrieve_result_from_cluster"
pack: "ductus"
description: "Rule that triggers a result retrieval workflow when an analysis is available for download"
enabled: false

trigger:
    type: "ductus.download_available"

criteria:
    trigger.process_location:
      type: "inside"
      pattern: ["miarka", "berk"]

action:
    ref: "ductus.run_workflow_with_trace_tags"
    parameters:
        workflow_ref: "ductus.retrieve_result_from_cluster"
        parameters:
          analysis_name: "{{trigger.analysis_name}}"
          analysis: "{{trigger.analysis}}"
          workpackage: "{{trigger.workpackage}}"
          created_date: "{{trigger.created_date}}"
          process_location: "{{trigger.process_location}}"
          download_host: "{{trigger.download_host}}"
          download_user: "{{trigger.download_user}}"
          download_key: "{{trigger.download_key}}"
          download_path_prefix: "{{trigger.download_path_prefix}}"
          download_copy_method: "{{trigger.download_copy_method}}"
        trace_tags:
          - "{{trigger.analysis_name}}"
