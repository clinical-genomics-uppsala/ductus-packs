---
name: "run_analysis_on_cluster"
pack: "ductus"
description: "Rule that triggers analysis on a processing cluster"
enabled: false

trigger:
    type: "ductus.upload_completed"

criteria:
    trigger.process_location:
      type: "inside"
      pattern: ["miarka", "berk"]

action:
    ref: "ductus.run_analysis_on_cluster"
    parameters:
        analysis_name: "{{trigger.analysis_name}}"
        workpackage: "{{trigger.workpackage}}"
        analysis: "{{trigger.analysis}}"
        process_location: "{{trigger.process_location}}"