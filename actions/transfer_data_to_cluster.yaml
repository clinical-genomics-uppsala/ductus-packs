---
name: transfer_data_to_cluster
description: >
  Will move necessary files for a requested analysis to a processing cluster
enabled: true
runner_type: orquesta
entry_point: workflows/transfer_data_to_cluster.yaml
pack: ductus
parameters:
  context:
    default: {}
    immutable: true
    type: object
  workflow:
    default: ductus.transfer_data_to_cluster
    immutable: true
    type: string
  analysis_name:
    required: true
    type: string
  process_location:
    required: true
    type: string
  upload_host:
    required: true
    type: string
  upload_user:
    required: true
    type: string
  upload_key:
    required: true
    type: string
  upload_path_prefix:
    required: true
    type: string
  upload_hospital_staging_path:
    required: true
    type: string
  upload_copy_method:
    required: true
    type: string
  processing_api_access_key:
    required: true
    type: string
    default: "{{ config_context.processing_api_access_key }}"
    secret: true
  processing_api_service_url:
    required: true
    type: string
    default: "{{ config_context.processing_api_service_url }}"
  processing_api_analysis_fastq_files_url:
    required: true
    type: string
    default: "{{ config_context.processing_api_analysis_fastq_files_url }}"
  processing_api_analysis_task_url:
    required: true
    type: string
    default: "{{ config_context.processing_api_analysis_task_url }}"
  processing_api_analysis_samples_url:
    required: true
    type: string
    default: "{{ config_context.processing_api_analysis_samples_url }}"
  processing_api_analysis_update_status_url:
    required: true
    type: string
    default: "{{ config_context.processing_api_analysis_update_status_url }}"
  mail_bioinfo:
    required: true
    type: string
    default: "{{ config_context.notification_mail_bioinfo }}"
