---
  class_name: "ProcessingApiSensor"
  entry_point: "processing_api_sensor.py"
  description: "Sensor which queries processing api for new analysis tasks"
  poll_interval: 15 # Every 15 s
  trigger_types:
    -
      name: "processing_api"
      description: "Trigger which indicates that a analysis task is available"
      payload_schema:
        type: "object"
        properties:
         analysis_name:
           type: "string"
         process_location:
           type: "string"
         event:
           type: "string"
         timestamp:
           type: "string"
         upload_host:
           type: "string"
         upload_user:
           type: "string"
         upload_key:
           type: "string"
         upload_path_prefix:
           type: "string"
         upload_hospital_staging_path:
           type: "string"
         upload_copy_method:
           type: "string"
